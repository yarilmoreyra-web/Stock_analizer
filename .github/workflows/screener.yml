name: Longbridge Stock Screener

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Tickers a analizar (separados por coma, ej: AAPL.US,MSFT.US,O.US)'
        required: true
        default: 'AAPL.US,MSFT.US'

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de Longbridge
        env:
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
        run: |
          python longbridge_screener.py --tickers "${{ github.event.inputs.tickers }}"

      - name: Subir Excel como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Longbridge_Analisis_Excel
          path: "*.xlsx"
          retention-days: 7
